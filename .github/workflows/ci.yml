name: Qualidade

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: TypeScript, lint, auditoria e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://claudioimoveis2.vercel.app
      NEXT_PUBLIC_SANITY_PROJECT_ID: znisst36
      NEXT_PUBLIC_SANITY_DATASET: production

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Verificar lint
        run: npm run lint

      - name: Gerar build de produção
        run: npm run build
